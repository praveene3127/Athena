[package]
name = "athena_rust_core"
version = "0.1.0"
edition = "2021"
description = "Athena high-performance pure-Rust text processing engine"
license = "MIT"

[lib]
name = "athena_rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
regex = "1.11"
aho-corasick = "1.1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
