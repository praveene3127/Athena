[package]
name = "athena_rust_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Athena high-performance pure-Rust text processing engine"
license = "GPL-3.0-or-later"

[lib]
name = "athena_rust_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
rayon = "1.10"
regex = "1.11"
aho-corasick = "1.1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
