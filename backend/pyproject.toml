[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-backend"
version = "1.1.0"
description = "Athena High-Performance Reading Engine Backend"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pymupdf>=2.0.0",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.0",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.0.0",
    "httpx[http2]>=0.28.1",
    "h2>=4.1.0",
    "fastembed>=0.4.0",
    "openai>=3.37.0",
    "google-genai>=2.33.0",
    "yake>=0.7.3",
    "python-dotenv>=1.0.1",
    "wordninja>=2.0.0",
    "cryptography>=42.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
