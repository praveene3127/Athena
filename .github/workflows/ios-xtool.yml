name: Athena iOS Build via xtool (Linux / Cross-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-xtool:
    name: Build iOS IPA with xtool on Linux (No Xcode Required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.4
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4'

      - name: Install usbmuxd and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y usbmuxd libimobiledevice-utils zip

      - name: Download and Install xtool
        run: |
          curl -L -o /usr/local/bin/xtool https://github.com/xtool-org/xtool/releases/download/1.23.0/xtool-x86_64.AppImage
          chmod +x /usr/local/bin/xtool

      - name: Configure xtool SDK
        run: |
          xtool --appimage-extract-and-run setup

      - name: Build and Package iOS IPA
        run: |
          cd app/ios
          xtool --appimage-extract-and-run dev --configuration release
          mkdir -p ../../releases/
          # Bundle into IPA archive
          mkdir -p Payload
          if [ -d ".build/release/Athena.app" ]; then
            cp -r .build/release/Athena.app Payload/
          else
            cp -r Runner Payload/Athena.app
          fi
          zip -r ../../releases/athena-ios-release.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-ios-release-ipa
          path: releases/athena-ios-release.ipa
          if-no-files-found: warn
