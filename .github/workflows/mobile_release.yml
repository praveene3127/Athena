name: Mobile Release — Android APK & unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Athena-Android-Release.apk

      - name: Upload Athena-Android-Release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Athena-Android-Release.apk
          path: app/Athena-Android-Release.apk
          if-no-files-found: error

  build-ios-unsigned-ipa:
    name: build-ios-unsigned-ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build unsigned iOS app and package IPA
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r Athena-iOS-Unsigned.ipa Payload

      - name: Upload Athena-iOS-Unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Athena-iOS-Unsigned.ipa
          path: app/build/ios/ipa/Athena-iOS-Unsigned.ipa
          if-no-files-found: error
