name: Android Release — Native APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Athena-Android.apk

      - name: Upload Athena-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: Athena-Android.apk
          path: app/Athena-Android.apk
          if-no-files-found: error

  publish-latest-release:
    name: publish-latest-release
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Athena-Android.apk
          path: release-assets

      - name: Publish 1-Click Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Athena Latest Release"
          body: |
            ## Athena Mobile Production Release
            - **Android APK**: Direct download for native install & Obtainium auto-update.
          files: release-assets/Athena-Android.apk
