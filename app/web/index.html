<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Athena — Preserves source text fidelity with grounded AI context.">
  <title>Athena</title>

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Athena">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicons & Web Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Bundled Brand Fonts (Offline Assets with Google CDN Fallback) -->
  <style>
    @font-face {
      font-family: 'DM Serif Display';
      font-style: normal;
      font-weight: 400;
      src: url('assets/assets/fonts/dm-serif-display-400-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'DM Serif Display';
      font-style: italic;
      font-weight: 400;
      src: url('assets/assets/fonts/dm-serif-display-400-italic.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 400;
      src: url('assets/assets/fonts/geist-400-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 500;
      src: url('assets/assets/fonts/geist-500-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 600;
      src: url('assets/assets/fonts/geist-600-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 700;
      src: url('assets/assets/fonts/geist-700-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: normal;
      font-weight: 400;
      src: url('assets/assets/fonts/newsreader-400-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: normal;
      font-weight: 500;
      src: url('assets/assets/fonts/newsreader-500-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: normal;
      font-weight: 600;
      src: url('assets/assets/fonts/newsreader-600-normal.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: normal;
      font-weight: 700;
      src: url('assets/assets/fonts/newsreader-700-normal.ttf') format('truetype');
      font-display: swap;
    }

    html, body {
      height: 100dvh;
      min-height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      background-color: #FFFFFF;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      width: 100vw;
      background-color: #FFFFFF;
      color: #000000;
      text-align: center;
    }

    .logo-box {
      width: 60px;
      height: 60px;
      background-color: #000000;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo-box svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }
    .title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #000000;
      margin: 0 0 6px 0;
    }
    .subtitle {
      font-family: 'Geist', sans-serif;
      font-size: 13px;
      color: #6B6B6B;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #EAEAEA;
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* iOS Safari Add to Home Screen Banner */
    #a2hs-banner {
      display: none;
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      background: #111111;
      color: #FFFFFF;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 999999;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #a2hs-banner .a2hs-text strong {
      color: #FFFFFF;
    }
    #a2hs-banner .a2hs-close {
      background: none;
      border: none;
      color: #888888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-box">
      <svg viewBox="0 0 256 256"><path fill-rule="evenodd" fill="#FFFFFF" d="M128 72C150 60 176 34 212 10C222 46 228 98 228 142A100 100 0 0 1 128 242A100 100 0 0 1 28 142C28 98 34 46 44 10C80 34 106 60 128 72ZM53 124A31 31 0 1 1 115 124A31 31 0 1 1 53 124ZM141 124A31 31 0 1 1 203 124A31 31 0 1 1 141 124ZM72 132A15 15 0 1 1 102 132A15 15 0 1 1 72 132ZM154 132A15 15 0 1 1 184 132A15 15 0 1 1 154 132ZM118 138L128 168L138 138Q128 131 118 138Z"/></svg>
    </div>
    <div class="title">ATHENA</div>
    <div class="subtitle">Read the whole book. Never read alone.</div>
    <div class="spinner"></div>
  </div>

  <div id="a2hs-banner">
    <div class="a2hs-text">
      Install <strong>Athena</strong> on your iPhone: tap <strong>Share</strong> (⎋) then <strong>Add to Home Screen</strong> (+).
    </div>
    <button class="a2hs-close" id="a2hs-close-btn" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    // Remove loading overlay on first frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
      checkA2hs();
    });

    // Check whether to show Add to Home Screen hint on iOS Safari
    function checkA2hs() {
      var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
      var isSafari = isIos && /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS/i.test(navigator.userAgent);
      var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      var dismissed = localStorage.getItem('athena_a2hs_dismissed');

      if (isSafari && !isStandalone && !dismissed) {
        var banner = document.getElementById('a2hs-banner');
        if (banner) {
          banner.style.display = 'flex';
          document.getElementById('a2hs-close-btn').onclick = function () {
            banner.style.display = 'none';
            localStorage.setItem('athena_a2hs_dismissed', 'true');
          };
        }
      }
    }

    // Service Worker update logic with skipWaiting
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        // Automatic refresh when a new service worker takes control
        console.log('[Athena] New service worker active, refreshing application...');
      });

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var reg of registrations) {
          reg.update();
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
